name: Check article

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  article:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Substack export
        run: python3 articles/whose-xg-is-it-anyway/scripts/build-substack.py --check
      - name: Check image exports
        run: python3 articles/whose-xg-is-it-anyway/scripts/render-images.py --check
