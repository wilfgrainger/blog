<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1650" viewBox="0 0 1080 1650" role="img" aria-labelledby="title desc">
  <title id="title">The model proposes. The service checks.</title>
  <desc id="desc">The agent requests a recruitment screen. An approved contract and candidate evidence independently feed the deterministic screening service. It checks identity and eligibility, season and league scope, provider and model, required evidence, penalty removal and qualifying minutes, and compares the unrounded metric. It returns three distinct outcomes: rank when evidence is usable and criteria pass; exclude when usable evidence fails criteria; withhold when evidence is missing or incompatible. The agent has no direct path around the service. Exceptions require a separate authorised decision.</desc>
  <rect x="0" y="0" width="1080" height="1650" rx="0" fill="#F6F1E7"/>
  <text x="60" y="60" font-family="Nimbus Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#52645D" text-anchor="start">WHOSE xG IS IT ANYWAY?</text>
  <text x="1020" y="60" font-family="Nimbus Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#52645D" text-anchor="end">02 / THE DECISION BOUNDARY</text>
  <path d="M60 87 H1020" stroke="#CFCDBF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="60" y="178" font-family="Nimbus Roman, Georgia, serif" font-size="75" font-weight="700" fill="#172B2A" text-anchor="start">The model proposes.</text>
  <text x="60" y="261" font-family="Nimbus Roman, Georgia, serif" font-size="75" font-weight="700" fill="#172B2A" text-anchor="start">The service checks.</text>
  <text x="60" y="317" font-family="Nimbus Sans, Arial, sans-serif" font-size="31" font-weight="400" fill="#52645D" text-anchor="start">One controlled route from the brief to the shortlist.</text>
