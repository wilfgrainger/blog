  <text x="210" y="1353" font-family="Nimbus Sans, Arial, sans-serif" font-size="29" font-weight="400" fill="#172B2A" text-anchor="middle">meets the brief</text>
  <rect x="390" y="1207" width="300" height="177" rx="0" fill="#FFFCF6" stroke="#CFCDBF" stroke-width="2"/>
  <text x="540" y="1263" font-family="Nimbus Sans, Arial, sans-serif" font-size="34" font-weight="700" fill="#172B2A" text-anchor="middle">EXCLUDE</text>
  <text x="540" y="1316" font-family="Nimbus Sans, Arial, sans-serif" font-size="29" font-weight="400" fill="#172B2A" text-anchor="middle">Evidence usable;</text>
  <text x="540" y="1353" font-family="Nimbus Sans, Arial, sans-serif" font-size="29" font-weight="400" fill="#172B2A" text-anchor="middle">fails the brief</text>
