  <rect x="590" y="552" width="430" height="231" rx="0" fill="#FFFCF6" stroke="#CFCDBF" stroke-width="2"/>
  <text x="86" y="598" font-family="Nimbus Sans, Arial, sans-serif" font-size="25" font-weight="700" fill="#164C3C" text-anchor="start">APPROVED CONTRACT</text>
  <text x="86" y="648" font-family="Nimbus Sans, Arial, sans-serif" font-size="34" font-weight="400" fill="#172B2A" text-anchor="start">npxG / 90 &gt; 0.55</text>
  <text x="86" y="695" font-family="Nimbus Sans, Arial, sans-serif" font-size="34" font-weight="400" fill="#172B2A" text-anchor="start">Provider A / v3</text>
  <text x="86" y="742" font-family="Nimbus Sans, Arial, sans-serif" font-size="34" font-weight="400" fill="#172B2A" text-anchor="start">League / 2025–26</text>
  <text x="616" y="598" font-family="Nimbus Sans, Arial, sans-serif" font-size="25" font-weight="700" fill="#3657BD" text-anchor="start">CANDIDATE EVIDENCE</text>
  <text x="616" y="648" font-family="Nimbus Sans, Arial, sans-serif" font-size="34" font-weight="400" fill="#172B2A" text-anchor="start">Player ID + source</text>
  <text x="616" y="695" font-family="Nimbus Sans, Arial, sans-serif" font-size="34" font-weight="400" fill="#172B2A" text-anchor="start">xG + penalty xG</text>
  <text x="616" y="742" font-family="Nimbus Sans, Arial, sans-serif" font-size="34" font-weight="400" fill="#172B2A" text-anchor="start">Minutes + scope</text>
