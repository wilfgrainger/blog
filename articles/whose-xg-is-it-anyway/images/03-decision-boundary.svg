  <rect x="60" y="839" width="960" height="303" rx="0" fill="#164C3C"/>
  <text x="92" y="893" font-family="Nimbus Sans, Arial, sans-serif" font-size="31" font-weight="700" fill="#FFFCF6" text-anchor="start">DETERMINISTIC SCREENING SERVICE</text>
  <text x="92" y="956" font-family="Nimbus Sans, Arial, sans-serif" font-size="30" font-weight="400" fill="#FFFCF6" text-anchor="start">Identity + eligibility</text>
  <text x="555" y="956" font-family="Nimbus Sans, Arial, sans-serif" font-size="30" font-weight="400" fill="#FFFCF6" text-anchor="start">Season + league scope</text>
  <text x="92" y="1013" font-family="Nimbus Sans, Arial, sans-serif" font-size="30" font-weight="400" fill="#FFFCF6" text-anchor="start">Approved provider + model</text>
  <text x="555" y="1013" font-family="Nimbus Sans, Arial, sans-serif" font-size="30" font-weight="400" fill="#FFFCF6" text-anchor="start">Required evidence present</text>
  <text x="92" y="1070" font-family="Nimbus Sans, Arial, sans-serif" font-size="30" font-weight="400" fill="#FFFCF6" text-anchor="start">Remove penalties; use minutes</text>
  <text x="555" y="1070" font-family="Nimbus Sans, Arial, sans-serif" font-size="30" font-weight="400" fill="#FFFCF6" text-anchor="start">Compare before rounding</text>
