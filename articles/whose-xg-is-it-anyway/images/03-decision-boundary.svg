  <text x="870" y="1316" font-family="Nimbus Sans, Arial, sans-serif" font-size="29" font-weight="400" fill="#172B2A" text-anchor="middle">Evidence missing</text>
  <text x="870" y="1353" font-family="Nimbus Sans, Arial, sans-serif" font-size="29" font-weight="400" fill="#172B2A" text-anchor="middle">or incompatible</text>
