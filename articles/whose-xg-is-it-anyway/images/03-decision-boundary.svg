  <text x="540" y="418" font-family="Nimbus Sans, Arial, sans-serif" font-size="26" font-weight="700" fill="#3657BD" text-anchor="middle">AGENT</text>
  <text x="540" y="465" font-family="Nimbus Sans, Arial, sans-serif" font-size="36" font-weight="400" fill="#172B2A" text-anchor="middle">Requests the recruitment screen</text>
