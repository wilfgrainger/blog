<svg xmlns="http://www.w3.org/2000/svg" width="800" height="940" viewBox="0 0 800 940" role="img" aria-labelledby="title desc">
<title id="title">McBaggio, checked.</title>
<desc id="desc">From the same full 2025/26 league season: subtract 3.16 penalty xG from 19.08 total xG to get 15.92 non-penalty xG. Divide by 2,684 matching league minutes and multiply by 90: 0.53 non-penalty xG per 90. Excluded by the screen requiring more than 0.55.</desc>
<rect width="800" height="940" fill="#fbf7ee"/>
<text x="42" y="76" fill="#102333" font-family="Georgia,serif" font-size="54" font-weight="700">McBaggio, checked.</text>
<text x="44" y="122" fill="#536876" font-family="Arial,Helvetica,sans-serif" font-size="30">2025/26 league · Provider A / v3.4</text>
<rect x="40" y="157" width="720" height="324" rx="22" fill="#fffdfa" stroke="#ddd4c5" stroke-width="2"/>
<g font-family="Arial,Helvetica,sans-serif">
  <text x="76" y="207" fill="#536876" font-size="30" font-weight="700">REMOVE THE FOUR PENALTIES</text>
  <text x="76" y="301" fill="#102333" font-size="82" font-weight="800">19.08</text>
  <text x="378" y="289" fill="#d64d47" font-size="60">−</text>
  <text x="490" y="301" fill="#b73d36" font-size="82" font-weight="800">3.16</text>
  <text x="78" y="343" fill="#536876" font-size="32">total xG</text>
  <text x="490" y="343" fill="#536876" font-size="32">penalty xG</text>
  <line x1="76" y1="371" x2="724" y2="371" stroke="#ddd4c5" stroke-width="2"/>
  <text x="76" y="450" fill="#0b7965" font-size="72" font-weight="800">15.92</text>
  <text x="325" y="438" fill="#102333" font-size="34">non-penalty xG</text>
</g>
<rect x="40" y="510" width="720" height="360" rx="22" fill="#08263a"/>
<g font-family="Arial,Helvetica,sans-serif">
  <text x="76" y="560" fill="#9ce6d3" font-size="30" font-weight="700">USE THE MATCHING MINUTES</text>
  <text x="76" y="626" fill="#fbf3e6" font-size="46">15.92 ÷ 2,684 × 90</text>
  <text x="70" y="746" fill="#fbf3e6" font-size="112" font-weight="800">0.53</text>
  <text x="365" y="698" fill="#c2d4dd" font-size="34">non-penalty xG</text>
  <text x="365" y="743" fill="#c2d4dd" font-size="34">per 90 minutes</text>
  <rect x="76" y="783" width="648" height="58" rx="11" fill="#ffe2dc"/>
  <text x="400" y="822" text-anchor="middle" fill="#922f2a" font-size="30" font-weight="700">EXCLUDED · needs more than 0.55</text>
</g>
<text x="400" y="918" text-anchor="middle" fill="#102333" font-family="Georgia,serif" font-size="34" font-weight="700">Same season. Correct metric.</text>
</svg>
