  <text x="398.5" y="949" font-family="Nimbus Sans, Arial, sans-serif" font-size="30" font-weight="400" fill="#172B2A" text-anchor="middle">Issuer B</text>
  <text x="398.5" y="1007" font-family="Nimbus Sans, Arial, sans-serif" font-size="48" font-weight="700" fill="#172B2A" text-anchor="middle">£3m</text>
  <rect x="589" y="903" width="180" height="134" rx="0" fill="#FFFCF6" stroke="#CFCDBF" stroke-width="2"/>
  <text x="679" y="949" font-family="Nimbus Sans, Arial, sans-serif" font-size="30" font-weight="400" fill="#172B2A" text-anchor="middle">Issuer A</text>
  <text x="679" y="1007" font-family="Nimbus Sans, Arial, sans-serif" font-size="48" font-weight="700" fill="#172B2A" text-anchor="middle">£6m</text>
  <rect x="808" y="903" width="180" height="134" rx="0" fill="#FFFCF6" stroke="#CFCDBF" stroke-width="2"/>
  <text x="898" y="949" font-family="Nimbus Sans, Arial, sans-serif" font-size="30" font-weight="400" fill="#172B2A" text-anchor="middle">Issuer B</text>
  <text x="898" y="1007" font-family="Nimbus Sans, Arial, sans-serif" font-size="48" font-weight="700" fill="#172B2A" text-anchor="middle">£3m</text>
  <text x="85" y="1100" font-family="Nimbus Sans, Arial, sans-serif" font-size="37" font-weight="700" fill="#172B2A" text-anchor="start">Separate groups:</text>
  <text x="85" y="1146" font-family="Nimbus Sans, Arial, sans-serif" font-size="37" font-weight="700" fill="#172B2A" text-anchor="start">£6m and £3m</text>
  <text x="85" y="1193" font-family="Nimbus Sans, Arial, sans-serif" font-size="27" font-weight="700" fill="#3657BD" text-anchor="start">APPARENT PASS</text>
  <text x="585" y="1100" font-family="Nimbus Sans, Arial, sans-serif" font-size="37" font-weight="700" fill="#172B2A" text-anchor="start">One group:</text>
  <text x="585" y="1146" font-family="Nimbus Sans, Arial, sans-serif" font-size="37" font-weight="700" fill="#172B2A" text-anchor="start">£6m + £3m = £9m</text>
  <text x="585" y="1193" font-family="Nimbus Sans, Arial, sans-serif" font-size="26" font-weight="700" fill="#B8402C" text-anchor="start">£9m &gt; £8m: LIMIT EXCEEDED</text>
  <text x="60" y="1330" font-family="Nimbus Roman, Georgia, serif" font-size="49" font-weight="700" fill="#172B2A" text-anchor="start">Same positions. Same prices.</text>
  <text x="60" y="1388" font-family="Nimbus Roman, Georgia, serif" font-size="49" font-weight="700" fill="#172B2A" text-anchor="start">Only the relationship changed.</text>
  <text x="60" y="1455" font-family="Nimbus Sans, Arial, sans-serif" font-size="35" font-weight="400" fill="#172B2A" text-anchor="start">Retrieving a record now does not make it current.</text>
