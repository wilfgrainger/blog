  <rect x="91.5" y="903" width="180" height="134" rx="0" fill="#FFFCF6" stroke="#CFCDBF" stroke-width="2"/>
  <text x="181.5" y="949" font-family="Nimbus Sans, Arial, sans-serif" font-size="30" font-weight="400" fill="#172B2A" text-anchor="middle">Issuer A</text>
