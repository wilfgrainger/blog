  <path d="M679 866 V899" stroke="#164C3C" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M670 887 L679 899 L688 887" stroke="#164C3C" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
