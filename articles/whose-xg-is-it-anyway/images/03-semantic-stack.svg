<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
<rect width="1200" height="675" fill="#f7f7f4"/>
<style>
  .title{font:700 48px Inter,Arial,sans-serif;fill:#102033}
  .h{font:700 30px Inter,Arial,sans-serif;fill:#102033}
  .b{font:400 23px Inter,Arial,sans-serif;fill:#2b3b4c}
  .s{font:600 19px Inter,Arial,sans-serif;fill:#415160}
  .tiny{font:500 16px Inter,Arial,sans-serif;fill:#53616d}
</style>
<text x="55" y="78" class="title">From information to meaning</text>
<text x="55" y="118" class="b">Each layer solves a different problem.</text>
<rect x="45" y="180" width="170" height="330" rx="18" fill="#e6eef7" stroke="#c8d3d8"/><text x="130" y="245" text-anchor="middle" class="h">RAG</text><text x="130" y="292" text-anchor="middle" class="s">Availability</text><text x="65" y="350" class="tiny">Find relevant information</text><text x="227" y="355" font-family="Inter,Arial" font-size="34" fill="#62727e">→</text><rect x="235" y="180" width="170" height="330" rx="18" fill="#e4f0fb" stroke="#c8d3d8"/><text x="320" y="245" text-anchor="middle" class="h">Tools</text><text x="320" y="292" text-anchor="middle" class="s">Capability</text><text x="255" y="350" class="tiny">Let the agent act</text><text x="417" y="355" font-family="Inter,Arial" font-size="34" fill="#62727e">→</text><rect x="425" y="180" width="170" height="330" rx="18" fill="#eee9fb" stroke="#c8d3d8"/><text x="510" y="245" text-anchor="middle" class="h">Schemas</text><text x="510" y="292" text-anchor="middle" class="s">Structure</text><text x="445" y="350" class="tiny">Keep data typed</text><text x="607" y="355" font-family="Inter,Arial" font-size="34" fill="#62727e">→</text><rect x="615" y="180" width="170" height="330" rx="18" fill="#e2f4e7" stroke="#c8d3d8"/><text x="700" y="245" text-anchor="middle" class="h">Semantic layer</text><text x="700" y="292" text-anchor="middle" class="s">Semantics</text><text x="635" y="350" class="tiny">Keep meaning aligned</text><text x="797" y="355" font-family="Inter,Arial" font-size="34" fill="#62727e">→</text><rect x="805" y="180" width="170" height="330" rx="18" fill="#fff0df" stroke="#c8d3d8"/><text x="890" y="245" text-anchor="middle" class="h">Deterministic controls</text><text x="890" y="292" text-anchor="middle" class="s">Governance</text><text x="825" y="350" class="tiny">Enforce invariants</text><text x="987" y="355" font-family="Inter,Arial" font-size="34" fill="#62727e">→</text><rect x="995" y="180" width="170" height="330" rx="18" fill="#e5f3e7" stroke="#c8d3d8"/><text x="1080" y="245" text-anchor="middle" class="h">Evidence-backed answer</text><text x="1080" y="292" text-anchor="middle" class="s">Trust</text><text x="1015" y="350" class="tiny">Produce a defensible result</text>
<text x="55" y="585" class="b">Ontology supplies the shared semantic contract; software still performs the enforcement.</text>
</svg>