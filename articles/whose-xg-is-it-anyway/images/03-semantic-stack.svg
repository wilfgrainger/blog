<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
<rect width="1200" height="900" fill="#fbfaf7"/>
<style>
.title{font:700 58px Inter,Arial,sans-serif;fill:#10243a}.sub{font:400 27px Inter,Arial,sans-serif;fill:#536277}
.cardTitle{font:700 29px Inter,Arial,sans-serif;fill:#10243a}.tag{font:700 20px Inter,Arial,sans-serif;fill:#294761}
.body{font:400 23px Inter,Arial,sans-serif;fill:#405267}.num{font:800 24px Inter,Arial,sans-serif;fill:white}
.footer{font:500 23px Inter,Arial,sans-serif;fill:#405267}
</style>
<text x="60" y="82" class="title">From information to meaning</text>
<text x="60" y="126" class="sub">Each layer solves a different problem. The sequence matters more than the technology.</text>

<!-- 1 -->
<rect x="60" y="180" width="330" height="235" rx="24" fill="#e8f2fb" stroke="#bed5e8" stroke-width="2"/>
<circle cx="100" cy="220" r="22" fill="#2776a8"/><text x="100" y="228" text-anchor="middle" class="num">1</text>
<text x="140" y="231" class="cardTitle">RAG</text>
<rect x="90" y="263" width="150" height="38" rx="19" fill="#d6e9f8"/><text x="165" y="289" text-anchor="middle" class="tag">AVAILABILITY</text>
<text x="90" y="342" class="body">Find the relevant</text><text x="90" y="373" class="body">information.</text>

<!-- 2 -->
<rect x="435" y="180" width="330" height="235" rx="24" fill="#e6f0fb" stroke="#bed5e8" stroke-width="2"/>
<circle cx="475" cy="220" r="22" fill="#2776a8"/><text x="475" y="228" text-anchor="middle" class="num">2</text>
<text x="515" y="231" class="cardTitle">Tools</text>
<rect x="465" y="263" width="150" height="38" rx="19" fill="#d5e7f9"/><text x="540" y="289" text-anchor="middle" class="tag">CAPABILITY</text>
<text x="465" y="342" class="body">Let the agent query,</text><text x="465" y="373" class="body">calculate and act.</text>

<!-- 3 -->
<rect x="810" y="180" width="330" height="235" rx="24" fill="#f0ebfb" stroke="#d7cdef" stroke-width="2"/>
<circle cx="850" cy="220" r="22" fill="#7159a7"/><text x="850" y="228" text-anchor="middle" class="num">3</text>
<text x="890" y="231" class="cardTitle">Schemas</text>
<rect x="840" y="263" width="150" height="38" rx="19" fill="#e4daf8"/><text x="915" y="289" text-anchor="middle" class="tag">STRUCTURE</text>
<text x="840" y="342" class="body">Keep interfaces typed</text><text x="840" y="373" class="body">and data tidy.</text>

<!-- flow wrap -->
<path d="M390 297 H423" stroke="#70808d" stroke-width="4"/><path d="M414 286 L425 297 L414 308" fill="none" stroke="#70808d" stroke-width="4"/>
<path d="M765 297 H798" stroke="#70808d" stroke-width="4"/><path d="M789 286 L800 297 L789 308" fill="none" stroke="#70808d" stroke-width="4"/>
<path d="M975 415 V452 H225 V480" fill="none" stroke="#70808d" stroke-width="4"/>
<path d="M214 469 L225 481 L236 469" fill="none" stroke="#70808d" stroke-width="4"/>

<!-- 4 -->
<rect x="60" y="485" width="330" height="235" rx="24" fill="#e5f5e8" stroke="#bdddc7" stroke-width="2"/>
<circle cx="100" cy="525" r="22" fill="#2f8053"/><text x="100" y="533" text-anchor="middle" class="num">4</text>
<text x="140" y="536" class="cardTitle">Semantic layer</text>
<rect x="90" y="568" width="150" height="38" rx="19" fill="#cfead6"/><text x="165" y="594" text-anchor="middle" class="tag">SEMANTICS</text>
<text x="90" y="647" class="body">Keep the same concept</text><text x="90" y="678" class="body">meaning the same thing.</text>

<!-- 5 -->
<rect x="435" y="485" width="330" height="235" rx="24" fill="#fff0df" stroke="#efd1ae" stroke-width="2"/>
<circle cx="475" cy="525" r="22" fill="#b66a25"/><text x="475" y="533" text-anchor="middle" class="num">5</text>
<text x="515" y="522" class="cardTitle">Deterministic</text><text x="515" y="554" class="cardTitle">controls</text>
<rect x="465" y="585" width="170" height="38" rx="19" fill="#f8dfc2"/><text x="550" y="611" text-anchor="middle" class="tag">GOVERNANCE</text>
<text x="465" y="660" class="body">Enforce rules and</text><text x="465" y="691" class="body">invariants in software.</text>

<!-- 6 -->
<rect x="810" y="485" width="330" height="235" rx="24" fill="#e6f5e9" stroke="#bdddc7" stroke-width="2"/>
<circle cx="850" cy="525" r="22" fill="#2f8053"/><text x="850" y="533" text-anchor="middle" class="num">6</text>
<text x="890" y="522" class="cardTitle">Evidence-backed</text><text x="890" y="554" class="cardTitle">answer</text>
<rect x="840" y="585" width="120" height="38" rx="19" fill="#d1ead7"/><text x="900" y="611" text-anchor="middle" class="tag">TRUST</text>
<text x="840" y="660" class="body">Produce a result that</text><text x="840" y="691" class="body">can be reconstructed.</text>

<path d="M390 602 H423" stroke="#70808d" stroke-width="4"/><path d="M414 591 L425 602 L414 613" fill="none" stroke="#70808d" stroke-width="4"/>
<path d="M765 602 H798" stroke="#70808d" stroke-width="4"/><path d="M789 591 L800 602 L789 613" fill="none" stroke="#70808d" stroke-width="4"/>

<line x1="60" y1="778" x2="1140" y2="778" stroke="#d1d9de" stroke-width="2"/>
<text x="600" y="830" text-anchor="middle" class="footer">Ontology supplies the shared semantic contract; software still performs the enforcement.</text>
</svg>