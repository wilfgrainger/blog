<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
<rect width="1200" height="675" fill="#0f1c27"/>
<text x="62" y="80" fill="#f8f2e7" font-family="Georgia,serif" font-size="50" font-weight="700">Authority up. Ambiguity down.</text>
<text x="64" y="118" fill="#a9bcc8" font-family="Arial,Helvetica,sans-serif" font-size="21">The same model can sit inside very different risk envelopes.</text>

<g font-family="Arial,Helvetica,sans-serif">
  <g><rect x="64" y="176" width="196" height="350" rx="22" fill="#173340"/><text x="162" y="220" text-anchor="middle" fill="#f8f2e7" font-size="20" font-weight="900">EXPLAIN</text><text x="162" y="255" text-anchor="middle" fill="#8dd1b6" font-size="15" font-weight="800">HIGHER AMBIGUITY OK</text><circle cx="162" cy="336" r="48" fill="#285467"/><text x="162" y="328" text-anchor="middle" fill="#f8f2e7" font-size="28" font-weight="900">?</text><text x="162" y="356" text-anchor="middle" fill="#d3e4e8" font-size="14">What is xG?</text><text x="162" y="445" text-anchor="middle" fill="#d3e4e8" font-size="15">Retrieve context</text><text x="162" y="470" text-anchor="middle" fill="#d3e4e8" font-size="15">show sources</text></g>
  <g><rect x="276" y="176" width="196" height="350" rx="22" fill="#1a3b45"/><text x="374" y="220" text-anchor="middle" fill="#f8f2e7" font-size="20" font-weight="900">RECOMMEND</text><text x="374" y="255" text-anchor="middle" fill="#8dd1b6" font-size="15" font-weight="800">EVIDENCE REQUIRED</text><circle cx="374" cy="336" r="48" fill="#2f625f"/><text x="374" y="328" text-anchor="middle" fill="#f8f2e7" font-size="28" font-weight="900">3</text><text x="374" y="356" text-anchor="middle" fill="#d3e4e8" font-size="14">watchlist</text><text x="374" y="445" text-anchor="middle" fill="#d3e4e8" font-size="15">Comparable data</text><text x="374" y="470" text-anchor="middle" fill="#d3e4e8" font-size="15">reconstructable answer</text></g>
  <g><rect x="488" y="176" width="196" height="350" rx="22" fill="#214744"/><text x="586" y="220" text-anchor="middle" fill="#f8f2e7" font-size="20" font-weight="900">DECIDE</text><text x="586" y="255" text-anchor="middle" fill="#f0c957" font-size="15" font-weight="800">SMALLER BUDGET</text><circle cx="586" cy="336" r="48" fill="#536b4d"/><path d="M566 332 l13 14 27-34" fill="none" stroke="#f8f2e7" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="586" y="356" text-anchor="middle" fill="#e5eadf" font-size="14">final shortlist</text><text x="586" y="445" text-anchor="middle" fill="#e5eadf" font-size="15">Deterministic</text><text x="586" y="470" text-anchor="middle" fill="#e5eadf" font-size="15">validation</text></g>
  <g><rect x="700" y="176" width="196" height="350" rx="22" fill="#4d4436"/><text x="798" y="220" text-anchor="middle" fill="#f8f2e7" font-size="20" font-weight="900">ACT</text><text x="798" y="255" text-anchor="middle" fill="#f0c957" font-size="15" font-weight="800">HUMAN GATE</text><circle cx="798" cy="336" r="48" fill="#6b5940"/><text x="798" y="326" text-anchor="middle" fill="#f8f2e7" font-size="24" font-weight="900">CALL</text><text x="798" y="356" text-anchor="middle" fill="#efe6d7" font-size="14">agent</text><text x="798" y="445" text-anchor="middle" fill="#efe6d7" font-size="15">Permission +</text><text x="798" y="470" text-anchor="middle" fill="#efe6d7" font-size="15">approval</text></g>
  <g><rect x="912" y="176" width="224" height="350" rx="22" fill="#533032"/><text x="1024" y="220" text-anchor="middle" fill="#f8f2e7" font-size="20" font-weight="900">COMMIT</text><text x="1024" y="255" text-anchor="middle" fill="#ff8b82" font-size="15" font-weight="800">TINY AMBIGUITY BUDGET</text><circle cx="1024" cy="336" r="48" fill="#7a3c3f"/><text x="1024" y="326" text-anchor="middle" fill="#fff" font-size="22" font-weight="900">£25m</text><text x="1024" y="356" text-anchor="middle" fill="#f5dddd" font-size="14">offer</text><text x="1024" y="445" text-anchor="middle" fill="#f5dddd" font-size="15">Hard boundary</text><text x="1024" y="470" text-anchor="middle" fill="#f5dddd" font-size="15">+ explicit authority</text></g>
